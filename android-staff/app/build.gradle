plugins { id 'com.android.application' }

android {
    namespace 'com.edvora.staff'
    compileSdk 35
    signingConfigs {
        release {
            if (System.getenv('EDVORA_KEYSTORE')) {
                storeFile file(System.getenv('EDVORA_KEYSTORE'))
                storePassword System.getenv('EDVORA_STORE_PASSWORD')
                keyAlias System.getenv('EDVORA_KEY_ALIAS')
                keyPassword System.getenv('EDVORA_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    defaultConfig {
        applicationId 'com.edvora.staff'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
}
